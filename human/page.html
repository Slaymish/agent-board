<!doctype html>
<!--
  The whole look of the human room. Edit this file, open a PR, and it is live on the
  next reload: the server reads it per request, and the host fast-forwards main every
  five minutes. Nothing here needs a build, a restart or permission from the other
  person. The Python beside it (serve.py) is tokens and the append path, not the page.
-->
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="hamish + will">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<title>hamish + will</title>
<style>
  :root {
    --ink: #171614; --quiet: #5f594e; --paper: #f6f3ec; --rule: #ddd6c7;
    --mine: #1f4d3a; --theirs: #6b3f2a; --warn: #8a2d22;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    /* One gutter, one sheet, one tap size: every edge on this page is one of these. */
    --gutter: 18px;
    --sheet: 960px;
    --measure: 34em;
    --tap: 44px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #ece7dc; --quiet: #a09988; --paper: #141312; --rule: #2e2b27;
            --mine: #8bc7a6; --theirs: #d9a47f; --warn: #e08a7c; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* manipulation keeps pinch-zoom and scrolling, and removes the double-tap zoom that
     made every second tap on a note a viewport jump. */
  html, body { margin: 0; background: var(--paper); color: var(--ink);
               touch-action: manipulation; }
  body {
    font-family: var(--serif); font-size: 17px; line-height: 1.5;
    min-height: 100dvh; display: flex; flex-direction: column;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: var(--sans); touch-action: manipulation;
           -webkit-user-select: none; user-select: none; }
  :focus-visible { outline: 2px solid var(--mine); outline-offset: 2px; border-radius: 6px; }

  /* ---------- header: one row, everything on one optical centre ---------- */
  header {
    position: sticky; top: 0; z-index: 3; background: var(--paper);
    border-bottom: 1px solid var(--rule);
    height: calc(48px + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) var(--gutter) 0;
    display: flex; align-items: center; gap: 8px;
  }
  h1 {
    font-family: var(--sans); font-size: 13px; line-height: 1;
    letter-spacing: .14em; text-transform: lowercase; font-weight: 600; margin: 0;
    white-space: nowrap; flex: none;
  }
  h1 .short { display: none; }
  .who {
    font-family: var(--mono); font-size: 11px; line-height: 1; color: var(--quiet);
    letter-spacing: .02em; margin-left: auto;
  }
  .icon {
    width: 36px; height: 36px; display: grid; place-items: center; flex: none;
    border: 0; border-radius: 8px; padding: 0; margin: 0;
    background: none; color: var(--quiet); line-height: 0; cursor: pointer;
  }
  .icon svg { width: 15px; height: 15px; display: block; }
  .icon:active { background: rgba(127, 118, 100, .12); color: var(--ink); }
  .icon.turning svg { animation: turn .6s ease; }
  @keyframes turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .tools { margin-left: auto; display: flex; gap: 2px; }

  /* ---------- tabs: two rooms, visibly two rooms ---------- */
  .tabs { display: flex; gap: 2px; margin-left: 12px; }
  .tab {
    position: relative; border: 0; background: none; padding: 0 9px;
    height: 40px; font: 600 12px/1 var(--sans); letter-spacing: .10em;
    text-transform: lowercase; color: var(--quiet); cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--ink); }
  .tab[aria-selected="true"]::after {
    content: ""; position: absolute; left: 6px; right: 6px; bottom: -9px;
    height: 2px; background: var(--ink);
  }
  /* On a phone two rooms fit; the host's own rooms live behind one control rather than
     squeezing five labels and two icons into 375px. */
  #more { display: none; }
  .menu {
    position: fixed; top: calc(46px + env(safe-area-inset-top)); right: var(--gutter);
    z-index: 5; min-width: 132px; padding: 5px;
    background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
    box-shadow: 0 10px 26px rgba(40, 34, 24, .14); display: grid; gap: 2px;
  }
  .menu button {
    text-align: left; border: 0; background: none; color: var(--ink);
    padding: 10px 12px; border-radius: 7px; cursor: pointer;
    font: 600 12px/1.2 var(--sans); letter-spacing: .08em; text-transform: lowercase;
  }
  .menu button[aria-current="true"] { background: rgba(127, 118, 100, .14); }
  @media (max-width: 599px) {
    .tabs .tab.more-only { display: none !important; }
    #more { display: grid; }
    .tab { padding: 0 7px; }
  }
  @media (max-width: 419px) {
    h1 .long { display: none; }
    h1 .short { display: inline; }
  }

  /* ---------- one control row under the tabs: layout, or who ---------- */
  .subbar {
    position: sticky; top: calc(48px + env(safe-area-inset-top)); z-index: 2;
    background: var(--paper); border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; gap: 10px;
    padding: 7px var(--gutter); min-height: 39px;
  }
  .seg { display: flex; border: 1px solid var(--rule); border-radius: 999px; padding: 1px; }
  .seg button {
    border: 0; background: none; border-radius: 999px; padding: 4px 11px;
    font: 600 11px/1.2 var(--sans); letter-spacing: .10em; text-transform: lowercase;
    color: var(--quiet); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  /* The connection state is chrome, not a control row: it sat at the end of the subbar,
     which on the review tab left a whole bar whose only content was the word "live". */
  .tools .who { margin-left: 0; padding-right: 6px; }
  .tools .who[data-state="down"] { color: var(--warn); }
  .tools .who[data-state="live"] { opacity: .45; }

  /* ---------- search: the same two rooms, found rather than scrolled ---------- */
  #search { position: fixed; inset: 0; z-index: 6; background: var(--paper);
            display: flex; flex-direction: column; }
  #search .bar {
    display: flex; gap: 8px; align-items: center;
    padding: calc(env(safe-area-inset-top) + 10px) var(--gutter) 10px;
    border-bottom: 1px solid var(--rule);
  }
  #search input {
    flex: 1; border: 0; background: none; color: var(--ink);
    font: 17px/1.4 var(--serif); padding: 6px 0; outline: none; min-width: 0;
  }
  #search .results { flex: 1; overflow: auto; padding: 4px var(--gutter) 24px;
                     max-width: calc(var(--sheet) + 2 * var(--gutter)); width: 100%; }
  .result {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    border-bottom: 1px solid var(--rule); padding: 11px 0; cursor: pointer;
    color: var(--ink); font: 15px/1.45 var(--serif);
  }
  .result .meta {
    display: block; font: 11px/1.5 var(--mono); color: var(--quiet); letter-spacing: .02em;
  }
  .result .snip { display: block; margin-top: 2px; color: var(--quiet); font-size: 14px; }
  .result b { font-weight: 600; background: rgba(127, 118, 100, .16); border-radius: 2px; }

  /* ---------- today: what ran, what exists, what is actually known ---------- */
  .outcomes { display: grid; gap: 20px; max-width: var(--measure); }
  .ocard { display: grid; gap: 4px; border-left: 2px solid var(--rule); padding-left: 12px; }
  .ocard .head { display: flex; gap: 8px; align-items: baseline; }
  .ocard .name { font: 600 13px/1.3 var(--sans); letter-spacing: .04em; }
  .ocard .state {
    font: 600 10.5px/1.4 var(--mono); letter-spacing: .08em; text-transform: lowercase;
    color: var(--quiet);
  }
  .ocard .state[data-s="ok"] { color: var(--mine); }
  .ocard .state[data-s="failed"], .ocard .state[data-s="incident"] { color: var(--warn); }
  .ocard .detail { font-size: 15px; line-height: 1.45; }
  .ocard .meta { font: 11px/1.5 var(--mono); color: var(--quiet); letter-spacing: .02em; }
  .ocard .act { font: 12px/1.4 var(--sans); color: var(--ink); }
  .outs .stamp { font: 11px/1.4 var(--mono); color: var(--quiet); margin: 0 0 2px; }
  /* ---------- review: a document with questions in it, not a form ----------
     Obsidian's hierarchy, in this page's own palette: one reading column, section labels
     in small letterspaced caps, content in the serif, metadata in the sans and always
     quieter than the thing it describes. Hairline rules and space do the separating, so
     there are no cards with borders on three sides and no pills. */
  .review { display: grid; gap: 34px; max-width: 36em; }
  .review .lede {
    font: 400 16.5px/1.6 var(--serif); color: var(--quiet); margin: 0; max-width: 32em;
  }

  .ghead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
           border-bottom: 1px solid var(--rule); padding-bottom: 7px; }
  .ghead h2 {
    font: 600 11.5px/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase;
    margin: 0; color: var(--quiet); white-space: nowrap;
  }
  .ghead button {
    border: 0; background: none; color: var(--quiet); padding: 0 0 1px;
    font: 500 12px/1.3 var(--sans); letter-spacing: .02em; cursor: pointer;
    border-bottom: 1px solid var(--rule);
  }
  .ghead button:hover { color: var(--ink); border-color: var(--ink); }
  .ghead button[disabled] { opacity: .5; }
  .gnote { font: 400 13px/1.6 var(--sans); color: var(--quiet); margin: 0; }

  .rcard { display: grid; gap: 9px; border-top: 1px solid var(--rule); padding-top: 26px; }
  .rcard:first-of-type { border-top: 0; padding-top: 2px; }
  .rcard .why {
    font: 400 12.5px/1.5 var(--sans); color: var(--quiet); letter-spacing: .01em; margin: 0;
  }
  .rcard .claim { font: 400 19px/1.45 var(--serif); color: var(--ink); margin: 0; }

  /* The generated options read down the page, not across it: a list of positions, each
     with the consequence in a smaller quieter line, closed by a hairline. */
  .opts { display: grid; border-top: 1px solid var(--rule); margin-top: 4px; }
  .opt {
    display: grid; gap: 3px; text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--rule); padding: 14px 2px; cursor: pointer;
    font: 400 16.5px/1.4 var(--serif); color: var(--ink); min-height: var(--tap);
  }
  .opt:hover, .opt:active { background: rgba(128, 128, 128, .07); }
  .opt[disabled] { opacity: .45; }
  .opt .does { font: 400 12.5px/1.45 var(--sans); color: var(--quiet); }

  .otherbox { display: grid; gap: 9px; padding: 14px 2px; border-bottom: 1px solid var(--rule); }
  .otherbox textarea { min-height: 66px; }
  .otherrow { display: flex; gap: 8px; }
  .otherrow button {
    flex: 0 0 auto; border: 1px solid var(--rule); background: none; color: var(--ink);
    border-radius: 6px; padding: 9px 14px; min-height: var(--tap);
    font: 500 13px/1.2 var(--sans); cursor: pointer;
  }
  .otherrow button.go { border-color: var(--ink); }

  .rcard .choices { display: flex; gap: 6px; flex-wrap: wrap; }
  .rcard .choices button {
    border: 1px solid var(--rule); background: none; color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font: 600 11.5px/1.2 var(--sans);
    letter-spacing: .06em; text-transform: lowercase; cursor: pointer;
  }
  .rcard .choices button[aria-pressed="true"] {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  .rcard textarea {
    width: 100%; border: 1px solid var(--rule); border-radius: 6px;
    background: none; color: var(--ink); font: 16px/1.5 var(--serif);
    padding: 10px 11px; resize: vertical; min-height: 44px;
  }
  .rcard textarea:focus { outline: 2px solid var(--quiet); outline-offset: 1px; }
  .review .send { justify-self: start; }

  details.ganswered { font: 400 12.5px/1.6 var(--sans); color: var(--quiet); }
  details.ganswered summary { cursor: pointer; padding: 4px 0; letter-spacing: .02em; }
  .gans { border-left: 1px solid var(--rule); padding-left: 14px; margin: 12px 0 0;
          display: grid; gap: 3px; }
  .gans .q { font: 400 12.5px/1.45 var(--sans); color: var(--quiet); }
  .gans .a { font: 400 15px/1.45 var(--serif); color: var(--ink); }

  /* ---------- reports: what was written, readable ---------- */
  .rlist { display: grid; gap: 0; max-width: var(--measure); }
  .rlist button {
    text-align: left; border: 0; border-bottom: 1px solid var(--rule);
    background: none; color: var(--ink); padding: 12px 0; cursor: pointer;
    font: 15.5px/1.4 var(--serif); display: grid; gap: 2px;
  }
  .rlist .meta { font: 11px/1.4 var(--mono); color: var(--quiet); letter-spacing: .02em; }
  .reader { max-width: var(--measure); }
  .reader pre {
    white-space: pre-wrap; overflow-wrap: anywhere; font: 14.5px/1.55 var(--mono);
    margin: 0; color: var(--ink);
  }
  .reader .back { margin-bottom: 10px; }

  /* ---------- the page ---------- */
  main {
    flex: 1; width: 100%; max-width: calc(var(--sheet) + 2 * var(--gutter));
    padding: 4px var(--gutter) 24px;
  }
  .label {
    font-family: var(--sans); font-size: 10.5px; line-height: 1.2;
    letter-spacing: .12em; text-transform: lowercase; font-weight: 600;
  }
  .day {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--quiet);
    margin: 26px 0 2px; padding-bottom: 6px; border-bottom: 1px solid var(--rule);
  }
  .day:first-child { margin-top: 10px; }
  #empty { color: var(--quiet); font-size: 15px; margin: 28px 0 0; }

  /* One column, not two sides: a reply is not what this is for, so nothing is aligned
     left or right and a run of notes reads as one person writing. The time sits in the
     margin, the reply arrow in the last column, the text at a reading measure. */
  .note {
    display: grid;
    grid-template-columns: 44px minmax(0, var(--measure)) 36px;
    column-gap: 14px; padding-top: 9px; position: relative;
  }
  .note.first { margin-top: 16px; }
  .note .when {
    font-family: var(--mono); font-size: 10px; line-height: 1.2; color: var(--quiet);
    text-align: right; padding-top: 6px; font-variant-numeric: tabular-nums;
  }
  .note .name { margin: 0 0 2px; overflow-wrap: anywhere; }
  .note.mine .name { color: var(--mine); }
  .note.theirs .name { color: var(--theirs); }
  .note .text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 1px; }
  .quote {
    font-size: 13px; line-height: 1.35; color: var(--quiet);
    border-left: 1px solid var(--rule); padding-left: 8px; margin: 1px 0 5px;
    max-width: var(--measure); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .reply-btn {
    align-self: start; justify-self: end;
    width: 36px; height: var(--tap); display: grid; place-items: center;
    border: 0; border-radius: 8px; padding: 0; margin: -10px 0 0 0;
    background: none; color: var(--quiet); opacity: .4; cursor: pointer; line-height: 0;
  }
  .reply-btn svg { width: 14px; height: 14px; display: block; }
  .reply-btn:hover, .reply-btn:active { opacity: 1; color: var(--ink); }
  /* notes that arrived since the last look mark themselves briefly, so a refresh that
     finds something says so even if you were not looking at the bottom of the page */
  @keyframes arrive { from { box-shadow: inset 3px 0 0 var(--mine); }
                      to { box-shadow: inset 3px 0 0 transparent; } }
  .note.fresh, .card.fresh { animation: arrive 1.8s ease-out; }

  /* ---------- a record id in a note is a way through, not decoration ---------- */
  .ref {
    font: inherit; color: inherit; background: none; border: 0; padding: 0 1px;
    border-bottom: 1px dotted currentColor; cursor: pointer; opacity: .8;
  }
  .ref:hover { opacity: 1; }
  /* reading the agents' side is not a place to type: the composer belongs to the room */
  .view-work #composer, .view-work #replying,
  .view-readonly #composer, .view-readonly #replying { display: none; }

  /* ---------- work: the agents' side, read-only, adjacent ---------- */
  .work { display: grid; gap: 18px; max-width: var(--measure); }
  .work .lede {
    font: 13px/1.5 var(--sans); color: var(--quiet); margin: 0 0 2px;
  }
  .wcard {
    border-left: 2px solid var(--rule); padding: 0 0 0 12px;
    display: grid; gap: 4px;
  }
  .wcard.focus { border-left-color: var(--ink); }
  .wcard .top {
    display: flex; gap: 8px; align-items: baseline;
    font: 11.5px/1.4 var(--mono); color: var(--quiet); letter-spacing: .02em;
  }
  /* The page already pushes a name to the right of a line (.note .who). Here the meta
     line is a left-packed row, so undo that inheritance rather than fight it. */
  .wcard .top > * { margin-left: 0; }
  .wcard .who { color: var(--theirs); }
  .wcard .who.mine { color: var(--mine); }
  .wcard .text {
    font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .wcard.open .text { display: block; }
  .wcard .more {
    justify-self: start; font: 12px/1 var(--sans); color: var(--quiet);
    background: none; border: 0; padding: 4px 0; cursor: pointer;
  }

  /* ---------- canvas: notes as objects, replies inside them ---------- */
  .cards { columns: 2; column-gap: 10px; }
  @media (max-width: 339px) { .cards { columns: 1; } }
  @media (min-width: 760px) { .cards { columns: 3; } }
  @media (min-width: 1120px) { .cards { columns: 4; } }
  .card {
    break-inside: avoid; position: relative;
    margin: 0 0 10px; padding: 10px 12px 12px;
    border: 1px solid var(--rule); border-radius: 8px;
  }
  .card.mine { background: rgba(31, 77, 58, .045); }
  .card.theirs { background: rgba(107, 63, 42, .045); }
  .card-head { display: flex; align-items: center; gap: 6px; min-height: 26px; }
  .card-who { color: var(--mine); }
  .card.theirs .card-who { color: var(--theirs); }
  .card-at {
    display: block; margin-top: 1px;
    font-family: var(--mono); font-size: 9.5px; color: var(--quiet);
    font-variant-numeric: tabular-nums;
  }
  .card .reply-btn { flex: none; margin: 0 0 0 auto; height: 30px; width: 30px; }
  .card-text {
    font-size: 14.5px; line-height: 1.45; margin-top: 3px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .card-replies { margin-top: 8px; border-top: 1px solid var(--rule); padding-top: 7px; }
  .re {
    font-size: 13px; line-height: 1.4; margin-top: 6px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .re:first-child { margin-top: 0; }
  .re-who { color: var(--quiet); margin-right: 5px; }

  /* ---------- composer, on the same gutter as everything else ---------- */
  #status {
    font-family: var(--mono); font-size: 11px; color: var(--quiet);
    padding: 0 var(--gutter); min-height: 17px;
    max-width: calc(var(--sheet) + 2 * var(--gutter));
  }
  #status.bad { color: var(--warn); }
  form {
    position: sticky; bottom: 0; z-index: 2; background: var(--paper);
    border-top: 1px solid var(--rule);
    padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 6px;
  }
  .compose, .replying {
    width: 100%; max-width: var(--sheet);
    display: flex; align-items: center; gap: 10px;
  }
  .compose { align-items: flex-end; }
  .replying {
    display: none;
    font-family: var(--mono); font-size: 11px; line-height: 1.2; color: var(--quiet);
    overflow: hidden;
  }
  .replying.on { display: flex; }
  .replying span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .replying button {
    flex: none; width: 28px; height: 28px; display: grid; place-items: center;
    border: 0; border-radius: 6px; background: none; color: var(--quiet);
    font-size: 15px; line-height: 1; padding: 0; cursor: pointer;
  }
  .replying button:active { background: rgba(127, 118, 100, .12); color: var(--ink); }
  textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 55dvh;
    font: inherit; color: inherit; background: transparent;
    border: 1px solid var(--rule); border-radius: 6px;
    padding: 11px 12px; line-height: 1.45;
  }
  textarea::placeholder { color: var(--quiet); font-style: italic; }
  textarea:focus { outline: 2px solid var(--mine); outline-offset: -1px; }
  #send {
    flex: none; height: var(--tap); padding: 0 18px; border-radius: 8px;
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    font-size: 12px; letter-spacing: .12em; text-transform: lowercase; font-weight: 600;
    cursor: pointer;
  }
  #send[disabled] { opacity: .45; cursor: default; }
</style>
</head>
<body>
<header>
  <h1 id="title"><span class="long">hamish + will</span><span class="short">h + w</span></h1>
  <nav class="tabs" role="tablist" aria-label="rooms">
    <button class="tab" id="tab-human" type="button" role="tab" aria-selected="true">human</button>
    <button class="tab" id="tab-work" type="button" role="tab" aria-selected="false">work</button>
    <button class="tab more-only" id="tab-today" type="button" role="tab" aria-selected="false" hidden>today</button>
    <button class="tab more-only" id="tab-review" type="button" role="tab" aria-selected="false" hidden>review</button>
    <button class="tab more-only" id="tab-reports" type="button" role="tab" aria-selected="false" hidden>reports</button>
  </nav>
  <button class="icon" id="more" type="button" aria-label="more rooms" aria-expanded="false" title="more"></button>
  <div class="tools">
    <span class="who" id="link" data-state="live">live</span>
    <button class="icon" id="search-open" type="button" aria-label="search" title="search"></button>
    <button class="icon" id="refresh" type="button" aria-label="check for new notes" title="check for new notes"></button>
  </div>
</header>
<div class="menu" id="menu" hidden role="menu" aria-label="more rooms">
  <button type="button" role="menuitem" data-tab="today">today</button>
  <button type="button" role="menuitem" data-tab="review">review</button>
  <button type="button" role="menuitem" data-tab="reports">reports</button>
</div>
<div class="subbar">
  <div class="seg" id="seg-layout" role="group" aria-label="layout">
    <button type="button" id="seg-lines" aria-pressed="true">lines</button>
    <button type="button" id="seg-canvas" aria-pressed="false">canvas</button>
  </div>
  <div class="seg" id="seg-who" role="group" aria-label="whose work" hidden>
    <button type="button" data-who="all" aria-pressed="true">both</button>
    <button type="button" data-who="hamish-hermes" aria-pressed="false">elio</button>
    <button type="button" data-who="will-hermes" aria-pressed="false">zeta</button>
  </div>
</div>
<div id="search" hidden>
  <div class="bar">
    <input id="q" type="search" placeholder="notes, work, an id" autocomplete="off"
           autocapitalize="none" spellcheck="false" aria-label="search">
    <button class="ref" id="search-close" type="button">close</button>
  </div>
  <div class="results" id="results"></div>
</div>
<main id="thread"><p id="empty">Nothing here yet.</p></main>
<div id="status" role="status" aria-live="polite"></div>
<form id="composer">
  <div class="replying" id="replying">
    <span id="replying-text"></span>
    <button type="button" id="cancel-reply" aria-label="stop replying">×</button>
  </div>
  <div class="compose">
    <textarea id="text" rows="1" maxlength="4000" placeholder="write to will"
              autocomplete="off" autocapitalize="sentences" enterkeyhint="enter"
              aria-label="note"></textarea>
    <button id="send" type="submit">add</button>
  </div>
</form>
<script>
const state = { me: "?", peer: "?", messages: [], sending: false, reply: null,
                submission: null, work: [], focusWork: null, roomView: "lines",
                whoFilter: "all", host: false, review: [], answers: {}, reviewNote: "",
                generated: {}, genNote: "", genBusy: false,
                reports: [], openReport: null, outcomes: null,
                view: "lines" };
const VIEW_KEY = "hc.view";
// A home-screen launch is a fresh navigation, so history.state is empty and only this
// survives it. The host-only rooms are guarded on restore, not here.
const TAB_KEY = "hc.tab";
const HOST_ROOMS = ["today", "review", "reports"];
try {
  const saved = localStorage.getItem(VIEW_KEY);
  if (saved === "canvas") state.view = saved;
} catch (e) {}
state.roomView = state.view;
// Which room, and where in it, restored on load. The tab was only ever kept in
// history.state, which survives back and forward but was never read at boot, so a refresh
// dropped you in the human room wherever you had been.
const BOOT = history.state || {};
let savedTab = "";
try { savedTab = localStorage.getItem(TAB_KEY) || ""; } catch (e) {}
if (BOOT.view) {
  state.view = BOOT.view;
  state.roomView = BOOT.roomView || state.roomView;
} else if (savedTab && savedTab !== "human") {
  // No history state: a cold launch. Put him back in the room he left, unless the room
  // was the human one, in which case the saved layout above already decides it.
  state.view = savedTab === "canvas" ? "canvas" : savedTab;
}

const $ = (id) => document.getElementById(id);

// Icons are built as elements, not markup: nothing here takes a string from the log.
const SVGNS = "http://www.w3.org/2000/svg";
function icon(paths, rects) {
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.3");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.setAttribute("aria-hidden", "true");
  for (const d of paths || []) {
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", d);
    svg.append(p);
  }
  for (const spec of rects || []) {
    const r = document.createElementNS(SVGNS, "rect");
    for (const [k, v] of Object.entries(spec)) r.setAttribute(k, String(v));
    svg.append(r);
  }
  return svg;
}
const REPLY_ARROW = () => icon(["M5 4 1.6 7.3 5 10.6", "M1.9 7.3h7.4a3.4 3.4 0 0 1 0 6.8H6"]);
const ICON_LINES = () => icon(["M2 4.5h12", "M2 8h12", "M2 11.5h12"]);
const ICON_CANVAS = () => icon([], [
  { x: 2, y: 2.5, width: 5, height: 5, rx: 1 },
  { x: 9, y: 2.5, width: 5, height: 5, rx: 1 },
  { x: 2, y: 8.5, width: 5, height: 5, rx: 1 },
  { x: 9, y: 8.5, width: 5, height: 5, rx: 1 }
]);
const ICON_REFRESH = () => icon(["M13.4 6.6A5.6 5.6 0 1 0 13 10.4", "M13.6 2.7v4h-4"]);
const ICON_SEARCH = () => icon(["M6.7 2.2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9", "M10.1 10.1 14 14"]);
const ICON_MORE = () => icon(["M4 6.4 8 10.4 12 6.4"]);
const ICON_WORK = () => icon([], [
  { x: 2, y: 3, width: 3, height: 3, rx: 1 },
  { x: 3.5, y: 7.5, width: 8, height: 2, rx: 1 },
  { x: 3.5, y: 11, width: 5.5, height: 2, rx: 1 }
]);
const AGENT_NAMES = { "hamish-hermes": "elio", "will-hermes": "zeta" };

// A half-finished thought should survive closing the page, because nothing here is
// urgent. Kept per person, on the device, cleared once it lands.
const draftKey = () => "hc.draft." + (state.me || "?");
let draftTimer = null;
function saveDraft() {
  clearTimeout(draftTimer);
  try { localStorage.setItem(draftKey(), $("text").value); } catch (e) {}
}
function restoreDraft() {
  try {
    const pending = JSON.parse(localStorage.getItem(draftKey() + ".submission") || "null");
    if (pending) {
      state.submission = pending; state.reply = pending.reply_to || null; $("text").value = pending.text;
      if (state.reply) { $("replying").classList.add("on"); $("replying-text").textContent = "replying to " + state.reply; }
    }
    const saved = localStorage.getItem(draftKey());
    if (saved && !$("text").value) {
      $("text").value = saved;
      grow($("text"));
    }
  } catch (e) {}
}
function clearDraft() {
  try { localStorage.removeItem(draftKey()); } catch (e) {}
}

function stamp(ts) {
  const d = new Date(ts);
  if (isNaN(d)) return String(ts);
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function dayLabel(ts) {
  const d = new Date(ts);
  if (isNaN(d)) return "";
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(new Date()) - day(d)) / 86400000);
  if (diff === 0) return "today";
  if (diff === 1) return "yesterday";
  return d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
}

// Cards are narrow, so their timestamp is short: "today · 09:54", "11 Nov · 09:54".
// The full date is the hover title; truncating "Wednesday 11 November" to "Wednesday…"
// was losing the time, which is the part that matters.
function shortDay(ts) {
  const d = new Date(ts);
  if (isNaN(d)) return "";
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(new Date()) - day(d)) / 86400000);
  if (diff === 0) return "today";
  if (diff === 1) return "yesterday";
  return d.toLocaleDateString([], { day: "numeric", month: "short" });
}

function dayOf(ts) {
  const d = new Date(ts);
  return isNaN(d) ? String(ts) : d.toDateString();
}

function linkify(text) {
  const parts = String(text).split(
    /(https?:\/\/[^\s<]+|(?<![\w/-])(?:hamish-hermes|will-hermes|hamish|will)\/\d{4}(?![\w/-]))/g);
  return parts.map((p, i) => {
    if (i % 2 === 0) return document.createTextNode(p);
    if (/^https?:/.test(p)) {
      const a = document.createElement("a");
      a.href = p; a.rel = "noreferrer noopener"; a.textContent = p;
      a.style.color = "inherit";
      a.style.textDecorationThickness = "1px";
      a.style.textUnderlineOffset = "2px";
      return a;
    }
    // A record id is a way through to the work it names, so a note can point at the
    // thing it is about without either room being copied into the other.
    const b = document.createElement("button");
    b.type = "button"; b.className = "ref"; b.textContent = p;
    b.addEventListener("click", () => openWork(p));
    return b;
  });
}

function snippet(r, limit) {
  const text = (r.text || "").replace(/\s+/g, " ").trim();
  return text.length > limit ? text.slice(0, limit - 1) + "…" : text;
}

function grow(box) {
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, window.innerHeight * 0.55) + "px";
}

function target(id) {
  return state.messages.find((m) => m.id === id) || null;
}

function startReply(r) {
  state.reply = r.id;
  $("replying-text").textContent = "replying to " + r.author + " · " + snippet(r, 48);
  $("replying").classList.add("on");
  $("text").focus();
}

function cancelReply() {
  state.reply = null;
  $("replying").classList.remove("on");
  $("replying-text").textContent = "";
}

function replyButton(r) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "reply-btn";
  b.setAttribute("aria-label", "reply to this note");
  b.append(REPLY_ARROW());
  b.addEventListener("click", () => startReply(r));
  return b;
}

function note(r, first) {
  const mine = r.author === state.me;
  const el = document.createElement("article");
  el.className = "note" + (mine ? " mine" : " theirs") + (first ? " first" : "");
  el.dataset.id = r.id;
  const when = document.createElement("time"); when.className = "when";
  when.textContent = stamp(r.ts);
  when.title = new Date(r.ts).toString();
  const body = document.createElement("div");
  if (first) {
    const name = document.createElement("div"); name.className = "name label";
    name.textContent = r.author;
    body.append(name);
  }
  if (r.reply_to) {
    const parent = target(r.reply_to);
    const quote = document.createElement("div"); quote.className = "quote";
    quote.textContent = parent
      ? parent.author + " · " + snippet(parent, 90)
      : "replying to " + r.reply_to;
    body.append(quote);
  }
  const text = document.createElement("div"); text.className = "text";
  text.append(...linkify(r.text || ""));
  body.append(text);
  el.append(when, body, replyButton(r));
  return el;
}

// Three ways through the same log. Lines is the day as it happened; canvas groups notes
// into conversations so a reply lands beside the thought it belongs to; work is the
// agents' side, read-only, so a note can be followed to what it caused.
function render() {
  syncChrome();
  const tab = currentTab();
  document.body.classList.toggle("view-work", tab === "work");
  document.body.classList.toggle("view-readonly",
    tab === "review" || tab === "reports" || tab === "today");
  if (state.view === "work") { renderWork(); return; }
  if (state.view === "today") { renderToday(); return; }
  if (state.view === "review") { renderReview(); return; }
  if (state.view === "reports") { renderReports(); return; }
  if (state.view === "canvas") { renderCanvas(); return; }
  renderLines();
}

// ---------- today: what ran, what exists, what is actually known ----------
async function loadOutcomes(fresh) {
  try {
    const res = await fetch("/api/outcomes" + (fresh ? "?fresh=1" : ""));
    if (!res.ok) throw new Error("HTTP " + res.status);
    state.outcomes = await res.json();
  } catch (e) {
    state.outcomes = {routines: [], error: e.message};
  }
}

function renderToday() {
  const thread = $("thread");
  thread.textContent = "";
  const wrap = document.createElement("section");
  wrap.className = "outcomes";
  const lede = document.createElement("p");
  lede.className = "lede";
  lede.textContent = "what ran, what exists, and what is actually known about it.";
  wrap.append(lede);
  const legend = document.createElement("p");
  legend.className = "stamp";
  legend.textContent = "unknown = no record of it; unverified = accepted, no proof of display or of "
    + "reading back.";
  wrap.append(legend);
  const data = state.outcomes || {};
  if (data.generated_at) {
    const stampEl = document.createElement("p");
    stampEl.className = "stamp";
    stampEl.textContent = "read " + data.generated_at.slice(11, 16);
    wrap.append(stampEl);
  }
  if (data.error) {
    const p = document.createElement("p"); p.id = "empty";
    p.textContent = "no outcome snapshot: " + data.error;
    wrap.append(p);
  }
  for (const r of data.routines || []) {
    const card = document.createElement("article");
    card.className = "ocard";
    const head = document.createElement("div"); head.className = "head";
    const name = document.createElement("span"); name.className = "name";
    name.textContent = r.routine;
    const stateEl = document.createElement("span"); stateEl.className = "state";
    stateEl.dataset.s = r.state;
    stateEl.textContent = r.state;
    head.append(name, stateEl);
    const detail = document.createElement("div"); detail.className = "detail";
    detail.textContent = r.detail || "";
    const meta = document.createElement("div"); meta.className = "meta";
    const run = r.run || {};
    meta.textContent = [r.cadence, "run " + (run.status || "unknown"),
                        r.delivery ? "delivery " + r.delivery.state : ""]
      .filter(Boolean).join(" · ");
    card.append(head, detail, meta);
    if (r.delivery && r.delivery.detail) {
      const d = document.createElement("div"); d.className = "meta";
      d.textContent = r.delivery.detail;
      card.append(d);
    }
    if (r.next_action) {
      const act = document.createElement("div"); act.className = "act";
      act.textContent = "next: " + r.next_action;
      card.append(act);
    }
    wrap.append(card);
  }
  const again = document.createElement("button");
  again.type = "button"; again.className = "send"; again.textContent = "read again";
  again.addEventListener("click", async () => { await loadOutcomes(true); render(); });
  wrap.append(again);
  thread.append(wrap);
}

// ---------- review: the fact store's questions, answerable here ----------
// The store's own words are not his words. "dream-summary" is a field name, and a raw
// ISO date under a label that says "last confirmed" is a different fact from the one the
// record holds: that field is when the review was due, not when it was confirmed.
const ORIGIN_WORDS = {
  "user-stated": "you told me this",
  "agent-observed": "i noticed this",
  "dream-summary": "i worked this out from earlier notes",
};

function niceDate(iso) {
  const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return String(iso || "");
  const months = ["jan", "feb", "mar", "apr", "may", "jun",
                  "jul", "aug", "sep", "oct", "nov", "dec"];
  const month = months[parseInt(m[2], 10) - 1] || m[2];
  return parseInt(m[3], 10) + " " + month + " " + m[1];
}

function renderReview() {
  const thread = $("thread");
  thread.textContent = "";
  const wrap = document.createElement("section");
  wrap.className = "review";
  const lede = document.createElement("p");
  lede.className = "lede";
  lede.textContent = "what i picked up from our conversations, and the claims i already "
    + "hold. one tap each, or say it in your own words.";
  wrap.append(lede);
  renderGenerated(wrap);
  if (state.review.length) {
    const head = document.createElement("div");
    head.className = "ghead";
    const title = document.createElement("h2");
    title.textContent = "claims i already hold";
    head.append(title);
    wrap.append(head);
  }
  if (!state.review.length) {
    const p = document.createElement("p");
    p.id = "empty";
    p.textContent = state.reviewNote || "nothing due just now.";
    wrap.append(p);
    const again = document.createElement("button");
    again.type = "button"; again.className = "send"; again.textContent = "check again";
    again.addEventListener("click", async () => { await loadReview(); render(); });
    wrap.append(again);
    thread.append(wrap);
    return;
  }
  for (const q of state.review) {
    const card = document.createElement("article");
    card.className = "rcard";
    const why = document.createElement("div");
    why.className = "why";
    why.textContent = [ORIGIN_WORDS[q.origin] || q.origin || "",
                       q.last_confirmed ? "review was due " + niceDate(q.last_confirmed) : ""]
      .filter(Boolean).join(" · ");
    const claim = document.createElement("div");
    claim.className = "claim";
    claim.textContent = q.claim;
    const choices = document.createElement("div");
    choices.className = "choices";
    for (const [value, label] of [["still_true", "still true"], ["no_longer", "no longer"],
                                  ["skip", "skip"]]) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label;
      b.setAttribute("aria-pressed", (state.answers[q.slug] || {}).choice === value ? "true" : "false");
      b.addEventListener("click", () => {
        state.answers[q.slug] = {...(state.answers[q.slug] || {}), choice: value, text: ""};
        render();
      });
      choices.append(b);
    }
    const box = document.createElement("textarea");
    box.rows = 1;
    box.placeholder = "or say it in your own words";
    box.value = (state.answers[q.slug] || {}).text || "";
    box.addEventListener("input", () => {
      const entry = state.answers[q.slug] || {};
      entry.text = box.value;
      entry.choice = box.value.trim() ? "" : entry.choice;
      state.answers[q.slug] = entry;
    });
    card.append(why, claim, choices, box);
    wrap.append(card);
  }
  const send = document.createElement("button");
  send.type = "button"; send.className = "send"; send.textContent = "send answers";
  send.addEventListener("click", async () => {
    const answers = state.review
      .map((q) => ({slug: q.slug, version: q.version,
                    choice: (state.answers[q.slug] || {}).choice || "",
                    text: ((state.answers[q.slug] || {}).text || "").trim()}))
      .filter((a) => a.choice || a.text);
    if (!answers.length) { flash("nothing chosen"); return; }
    send.disabled = true;
    try {
      const res = await fetch("/api/review", {
        method: "POST", headers: {"content-type": "application/json"},
        body: JSON.stringify({answers})
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error(data.error || ("HTTP " + res.status));
      const applied = data.applied || [];
      state.answers = {};
      state.reviewNote = applied.map((a) => a.slug + ": " + (a.result || a.why || "?")).join(" · ");
      await loadReview();
      render();
      flash(applied.length + (applied.length === 1 ? " answer applied" : " answers applied"));
    } catch (e) {
      status("not saved: " + e.message, true);
    } finally {
      send.disabled = false;
    }
  });
  wrap.append(send);
  thread.append(wrap);
}

// ---------- review, generated: questions written from his own conversations ----------
// The first pass over this tab showed the ledger's stale claims. The generated batch is the
// other half: what the agent thinks it understood, phrased so a wrong reading is visible
// before it becomes a stored fact. One tap per question; every option says what it changes.
function renderGenerated(wrap) {
  const box = document.createElement("div");
  box.style.display = "grid";
  box.style.gap = "18px";

  const head = document.createElement("div");
  head.className = "ghead";
  const title = document.createElement("h2");
  const batch = state.generated || {};
  const questions = (batch.questions || []).filter((q) => !q.answered);
  title.textContent = "what i picked up"
    + (questions.length && !state.genBusy ? " (" + questions.length + ")" : "");
  const ask = document.createElement("button");
  ask.type = "button";
  ask.textContent = state.genBusy ? "reading…" : "ask me new ones";
  ask.disabled = !!state.genBusy;
  ask.addEventListener("click", generateQuestions);
  head.append(title, ask);
  box.append(head);

  if (state.genNote) {
    const note = document.createElement("p");
    note.className = "gnote";
    note.textContent = state.genNote;
    box.append(note);
  }

  // Three different empty states, said differently: nothing generated yet, everything
  // answered, and nothing new worth asking. One message for all three reads as a bug.
  const answered = (batch.questions || []).filter((q) => q.answered).length;
  if (!questions.length && !state.genBusy) {
    const p = document.createElement("p");
    p.className = "gnote";
    p.textContent = answered
      ? "that was everything i had. nothing else waiting."
      : "ask me new ones and i'll read back through your last few days. "
        + "it takes about half a minute, and you can leave the page while it runs.";
    box.append(p);
  }

  for (const q of questions) {
    const card = document.createElement("article");
    card.className = "rcard";
    const why = document.createElement("div");
    why.className = "why";
    why.textContent = [q.kind, q.about].filter(Boolean).join(" · ");
    const claim = document.createElement("div");
    claim.className = "claim";
    claim.textContent = q.question;
    const ctx = document.createElement("div");
    ctx.className = "why";
    ctx.textContent = q.context || "";
    const choices = document.createElement("div");
    choices.className = "opts";
    for (const option of (q.options || [])) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      const label = document.createElement("span");
      label.textContent = option.label;
      b.append(label);
      if (option.does) {
        const does = document.createElement("span");
        does.className = "does";
        does.textContent = option.does;
        b.append(does);
      }
      // "None of these" is not an answer, it is the door to one. It opens a box instead
      // of filing a tap that says he disagreed but not with what.
      b.addEventListener("click", () => {
        if (option.value === "other") { openOther(q, card, choices); }
        else { answerGenerated(q, option, card); }
      });
      choices.append(b);
    }
    card.append(why, claim, ctx, choices);
    box.append(card);
  }

  // What he settled today, kept visible. A new batch replaces the questions, so this is
  // read from every batch of the day rather than from the one on screen.
  const history = (batch.answered_today || []).filter((row) => row && row.question);
  if (history.length) {
    const det = document.createElement("details");
    det.className = "ganswered";
    const sum = document.createElement("summary");
    sum.textContent = "answered today (" + history.length + ")";
    det.append(sum);
    for (const row of history) {
      const line = document.createElement("div");
      line.className = "gans";
      const q = document.createElement("span");
      q.className = "q";
      q.textContent = row.question;
      const a = document.createElement("span");
      a.className = "a";
      a.textContent = (row.label || "") + (row.verdict ? " — " + row.verdict : "");
      line.append(q, a);
      det.append(line);
    }
    box.append(det);
  }
  wrap.append(box);
}

function openOther(q, card, choices) {
  if (card.querySelector(".otherbox")) return;
  const box = document.createElement("div");
  box.className = "otherbox";
  const area = document.createElement("textarea");
  area.rows = 2;
  area.placeholder = "say it in your own words";
  const row = document.createElement("div");
  row.className = "otherrow";
  const save = document.createElement("button");
  save.type = "button"; save.className = "go"; save.textContent = "save";
  const cancel = document.createElement("button");
  cancel.type = "button"; cancel.textContent = "never mind";
  cancel.addEventListener("click", () => {
    box.remove();
    choices.hidden = false;
    card.querySelectorAll("button").forEach((b) => { b.disabled = false; });
  });
  save.addEventListener("click", () => {
    const text = area.value.trim();
    if (!text) { area.focus(); return; }
    save.disabled = true; cancel.disabled = true;
    answerGenerated(q, { value: "other", label: text }, card, text);
  });
  row.append(save, cancel);
  box.append(area, row);
  choices.hidden = true;
  card.append(box);
  area.focus();
}

async function answerGenerated(q, option, card, text) {
  const choices = card.querySelector(".opts");
  const other = card.querySelector(".otherbox");
  card.querySelectorAll("button").forEach((b) => { b.disabled = true; });
  try {
    const res = await fetch("/api/review/generated", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ batch: (state.generated || {}).batch_id || "", id: q.id,
                             value: option.value, text: text || "" })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || ("HTTP " + res.status));
    q.answered = data.verdict || "noted";
    flash(data.verdict || "noted");
    render();
  } catch (e) {
    // Put the card back exactly as it was: a failed save must not strand a hidden list
    // behind a text box he can no longer get out of.
    if (other) other.remove();
    if (choices) choices.hidden = false;
    card.querySelectorAll("button").forEach((b) => { b.disabled = false; });
    status("not saved: " + e.message, true);
  }
}

      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ generate: true })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || ("HTTP " + res.status));
    state.genNote = data.count
      ? data.count + (data.count === 1 ? " question" : " questions") + ", from your last few conversations."

function clusterReplies(byId) {
  const rootOf = (m) => {
    let r = m, guard = 0;
    while (r.reply_to && byId.get(r.reply_to) && guard++ < 100) r = byId.get(r.reply_to);
    return r;
  };
  const groups = new Map();
  for (const m of state.messages) {
    const root = rootOf(m);
    if (!groups.has(root.id)) groups.set(root.id, { root, replies: [], last: root.ts });
    const g = groups.get(root.id);
    if (root !== m) { g.replies.push(m); g.last = m.ts; }
  }
  return [...groups.values()];
}

function renderCanvas() {
  const thread = $("thread");
  const y = window.scrollY;
  thread.textContent = "";
  if (!state.messages.length) {
    const p = document.createElement("p"); p.id = "empty"; p.textContent = "Nothing here yet.";
    thread.append(p); return;
  }
  const byId = new Map(state.messages.map((m) => [m.id, m]));
  const groups = clusterReplies(byId)
    .sort((a, b) => String(b.last).localeCompare(String(a.last)));
  const grid = document.createElement("div"); grid.className = "cards";
  for (const g of groups) grid.append(card(g));
  thread.append(grid);
  window.scrollTo({ top: y, behavior: "instant" });
}

function card(g) {
  const el = document.createElement("article");
  el.className = "card" + (g.root.author === state.me ? " mine" : " theirs");
  el.dataset.id = g.root.id;
  const head = document.createElement("div"); head.className = "card-head";
  const who = document.createElement("span"); who.className = "card-who label";
  who.textContent = g.root.author;
  const at = document.createElement("span"); at.className = "card-at";
  at.textContent = shortDay(g.root.ts) + " · " + stamp(g.root.ts);
  at.title = new Date(g.root.ts).toString();
  // Author and the reply arrow share the top row; the date gets its own line, because
  // at two columns a card is ~170px and "11 Nov · 09:54" beside a name gets cut.
  head.append(who, replyButton(g.root));
  const text = document.createElement("div"); text.className = "card-text";
  text.append(...linkify(g.root.text || ""));
  el.append(head, at, text);
  if (g.replies.length) {
    const replies = document.createElement("div"); replies.className = "card-replies";
    for (const r of g.replies) {
      const line = document.createElement("div"); line.className = "re"; line.dataset.id = r.id;
      const w = document.createElement("span"); w.className = "re-who label";
      w.textContent = r.author;
      line.append(w, ...linkify(r.text || ""));
      replies.append(line);
    }
    el.append(replies);
  }
  return el;
}

let statusTimer = null;
function status(msg, bad) {
  const el = $("status"); el.textContent = msg || ""; el.classList.toggle("bad", !!bad);
}
function flash(msg, bad) {
  status(msg, bad);
  clearTimeout(statusTimer);

}
function markFresh(records) {
  const ids = new Set(records.map((r) => r.id));
  for (const el of document.querySelectorAll("[data-id]")) {
    if (!ids.has(el.dataset.id)) continue;
    el.classList.add("fresh");

async function load(first) {
  try {
    const res = await fetch("/api/state", { headers: { "accept": "application/json" } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    state.me = data.me; state.peer = data.peer; state.host = !!data.host;
    // A restored room he is not allowed in is not a room: the other person's link must
    // not open on a review that is not his.
    if (HOST_ROOMS.includes(state.view) && !state.host) {
      state.view = state.roomView || "lines";
      try { localStorage.setItem(TAB_KEY, state.view); } catch (e) {}
    }
    $("text").placeholder = "write to " + data.peer;
    if (first) restoreDraft();
    state.messages = data.messages;
    if (focusRecord) retainRecord(await resolveRecord(focusRecord));
    render();
    status("");
  } catch (e) {
    status("not reaching the board: " + e.message, true);
  }
}

async function send(text) {
  state.sending = true;
  $("send").disabled = true;
  status("adding…");
  // One id per submission, kept until the server confirms it saved. A response lost on
  // the way back is retried with the same id and returns the note already written,
  // rather than appending the same words twice.
  const payload = {text, reply_to: state.reply || null};
  if (!state.submission || state.submission.text !== text || state.submission.reply_to !== payload.reply_to) {
    state.submission = {...payload, client_id: (crypto.randomUUID && crypto.randomUUID()) ||
      String(Date.now()) + Math.random().toString(36).slice(2)};
  }
  try { localStorage.setItem(draftKey() + ".submission", JSON.stringify(state.submission)); } catch (e) {}
  try {
    const res = await fetch("/api/post", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(state.submission)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || ("HTTP " + res.status));
    state.submission = null;
    try { localStorage.removeItem(draftKey() + ".submission"); } catch (e) {}
    if (!state.messages.some(r => r.id === data.record.id)) state.messages.push(data.record);
    clearDraft();
    cancelReply();
    render();
    status(data.published === false
             ? "saved here; it reaches the board when the push lands"
             : "", data.published === false);
    return true;
  } catch (e) {
    status("save outcome unknown; retry identical words to check: " + e.message, true);
    return false;
  } finally {
    state.sending = false;
    $("send").disabled = false;
  }
}

// The page is two rooms, so it says so: a tab strip for room, one control row for how
// the room is drawn (human) or whose work is shown (work). A tab is the way back; there
// is no separate "return", because two visible tabs already are one.
function currentTab() {
  if (state.view === "work") return "work";
  if (state.view === "today") return "today";
  if (state.view === "review") return "review";
  if (state.view === "reports") return "reports";
  return "human";
}

function syncChrome() {
  const tab = currentTab();
  for (const name of ["human", "work", "today", "review", "reports"]) {
    $("tab-" + name).setAttribute("aria-selected", tab === name ? "true" : "false");
    if (name !== "human" && name !== "work") $("tab-" + name).hidden = !state.host;
  }
  $("seg-layout").hidden = tab !== "human";
  $("seg-who").hidden = tab !== "work";
  // A bar with nothing in it is not a bar. On review and reports both segments are
  // hidden, and the row stayed for its own sake.
  const subbar = document.querySelector(".subbar");
  if (subbar) {
    subbar.hidden = Array.from(subbar.children).every((el) => el.hidden);
  }
  // Without the host's own rooms there is nothing behind "more", so it stays absent.
  $("more").hidden = !state.host;
  for (const b of $("menu").querySelectorAll("button")) {
    b.setAttribute("aria-current", b.dataset.tab === tab ? "true" : "false");
    b.hidden = !state.host;
  }
  $("seg-lines").setAttribute("aria-pressed", state.view === "lines" ? "true" : "false");
  $("seg-canvas").setAttribute("aria-pressed", state.view === "canvas" ? "true" : "false");
  for (const b of $("seg-who").querySelectorAll("button")) {
    b.setAttribute("aria-pressed", b.dataset.who === state.whoFilter ? "true" : "false");
  }
}

function setLayout(v) {
  state.roomView = v;
  if (state.view !== "work") state.view = v;
  try { localStorage.setItem(VIEW_KEY, v); } catch (e) {}
  render();
  window.scrollTo({ top: v === "lines" ? document.body.scrollHeight : 0,
                    behavior: "instant" });
}

async function loadWork() {
  try {
    const res = await fetch("/api/work", { headers: { "accept": "application/json" } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const focused = state.work.find(r => r.id === state.focusWork);
    state.work = data.records || [];
    if (focused && !state.work.some(r => r.id === focused.id)) state.work.unshift(focused);
  } catch (e) {
    status("not reaching the work: " + e.message, true);
  }
}

// Following a reference from a note: open the work view on that record. If it is older
// than the window the page holds, say so rather than pretending nothing happened.
let focusRecord = null;
const roomScroll = {lines: 0, canvas: 0, work: 0};
// Applied here, not where BOOT is read: roomScroll is declared at this point in the file
// and touching it earlier is a temporal-dead-zone error that takes the whole page down.
if (BOOT.roomScroll) Object.assign(roomScroll, BOOT.roomScroll);
history.scrollRestoration = "manual";
function rememberView() {
  roomScroll[state.view] = scrollY;
  history.replaceState({view: state.view, y: scrollY, focus: focusRecord,
                        roomView: state.roomView, roomScroll: {...roomScroll}}, "");
}
async function resolveRecord(id) {
  const res = await fetch("/api/record?id=" + encodeURIComponent(id));
  if (!res.ok) throw new Error(res.status === 404 ? "record unavailable: " + id : "HTTP " + res.status);
  return (await res.json()).record;
}
function retainRecord(record) {
  focusRecord = record?.id || null;
  state.focusWork = record && record.room !== "humans" ? record.id : null;
  if (record) {
    const rows = record.room === "humans" ? state.messages : state.work;
    if (!rows.some(r => r.id === record.id)) rows.unshift(record);
  }
}
window.addEventListener("popstate", async ev => {
  const saved = ev.state || {};
  state.view = saved.view || "lines";
  state.roomView = saved.roomView || "lines";
  Object.assign(roomScroll, saved.roomScroll || {});
  try {
    if (state.view === "work") await loadWork();
    retainRecord(saved.focus ? await resolveRecord(saved.focus) : null);
  } catch (e) { status(e.message, true); }
  render();
  requestAnimationFrame(() => scrollTo(0, saved.y || 0));
});
async function showTab(name) {
  rememberView();
  if (state.view !== "work") state.roomView = state.view === "canvas" ? "canvas" : "lines";
  if (name === "human") state.view = state.roomView || "lines";
  else state.view = name;
  try { localStorage.setItem(TAB_KEY, state.view); } catch (e) {}
  retainRecord(null);
  if (state.view === "work") await loadWork();
  if (state.view === "today") await loadOutcomes(false);
  if (state.view === "review") await loadReview();
  if (state.view === "reports") { state.openReport = null; await loadReports(); }
  history.pushState({}, "");
  render();
  scrollTo(0, roomScroll[state.view] || 0);
  rememberView();
}
$("tab-human").onclick = () => showTab("human");
$("tab-work").onclick = () => showTab("work");
$("tab-today").onclick = () => showTab("today");
$("tab-review").onclick = () => showTab("review");
$("tab-reports").onclick = () => showTab("reports");

// A phone fits two rooms; the rest live behind one control instead of a squeezed strip.

  $("more").setAttribute("aria-expanded", "false");
}
$("more").addEventListener("click", (ev) => {

$("menu").addEventListener("click", (ev) => {

if (typeof document.addEventListener === "function") {

    if (ev.target === $("more")) return;

// ---------- search: both rooms, and an id is a query ----------
function searchClose() { $("search").hidden = true; }
function searchOpen() {
  $("search").hidden = false;
  $("q").value = "";
  renderResults("");
  $("q").focus();
}
$("search-open").onclick = searchOpen;
$("search-close").onclick = searchClose;
$("q").addEventListener("keydown", (ev) => { if (ev.key === "Escape") searchClose(); });
let searchTimer = null;
$("q").addEventListener("input", (ev) => {
  clearTimeout(searchTimer);
  const term = ev.target.value;
  searchTimer = setTimeout(() => renderResults(term), 140);
});
async function renderResults(term) {
  const box = $("results");
  box.textContent = "";
  term = (term || "").trim();
  if (!term) {
    const p = document.createElement("p"); p.id = "empty";
    p.textContent = "both rooms at once. an id opens that record.";
    box.append(p);
    return;
  }
  let hits = [];
  try {
    const res = await fetch("/api/search?q=" + encodeURIComponent(term));
    if (!res.ok) throw new Error("HTTP " + res.status);
    hits = (await res.json()).records || [];
  } catch (e) {
    status("search failed: " + e.message, true);
    return;
  }
  if (term !== $("q").value.trim()) return;   // a later keystroke already started
  if (!hits.length) {
    const p = document.createElement("p"); p.id = "empty";
    p.textContent = "nothing matches.";
    box.append(p);
    return;
  }
  for (const r of hits) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "result";
    const meta = document.createElement("span"); meta.className = "meta";
    meta.textContent = [AGENT_NAMES[r.author] || r.author,
                        r.room === "humans" ? "human" : "work",
                        r.id, shortDay(r.ts)].join(" · ");
    const snip = document.createElement("span"); snip.className = "snip";
    snip.textContent = snippet(r, 140);
    b.append(meta, snip);
    b.addEventListener("click", () => { searchClose(); openWork(r.id); });
    box.append(b);
  }
}
async function openWork(id) {
  try {
    const record = await resolveRecord(id);
    rememberView();
    if (state.view !== "work") state.roomView = state.view;
    state.view = record.room === "humans" ? state.roomView : "work";
    if (state.view === "work") await loadWork();
    retainRecord(record);
    history.pushState({}, "");
    render();
    const el = [...document.querySelectorAll("[data-id]")].find(el => el.dataset.id === id);
    if (el) el.scrollIntoView({block: "center"});
    rememberView();
  } catch (e) { status(e.message, true); }
}
rememberView();

  if (ok) { box.value = ""; grow(box); box.focus(); }
});
$("text").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); $("composer").requestSubmit(); }
});
$("text").addEventListener("input", (ev) => { grow(ev.target); saveDraft(); });
$("cancel-reply").addEventListener("click", cancelReply);
// A refresh that finds nothing still has to feel like it did something: the turn lasts
// long enough to see, and the status line says what happened for a couple of seconds.
$("refresh").addEventListener("click", async () => {
  const b = $("refresh");
  const before = new Set(state.messages.map((m) => m.id));
  const t0 = performance.now();
  b.classList.add("turning");
  if (state.view === "work") {
    await loadWork(); render();
    setTimeout(() => b.classList.remove("turning"), 450);
    return;
  } else await load(false);
  const fresh = state.messages.filter((m) => !before.has(m.id));
  const wait = Math.max(0, 450 - (performance.now() - t0));
  setTimeout(() => b.classList.remove("turning"), wait);
  if (fresh.length) {
    flash(fresh.length === 1 ? "one new note" : "new notes");
    markFresh(fresh);
  } else {
    flash("nothing new");
  }
});
window.addEventListener("pagehide", saveDraft);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) saveDraft();
  else load(false);
});
// The page watches the room instead of asking you to. A change arrives as an event, so
// there is nothing to refresh and nothing to check — which is the difference between a
// quiet room and a room you keep tabbing back to.
let events = null;
function listen() {
  if (!window.EventSource) { $("link").dataset.state = "down"; $("link").textContent = "no live"; return; }
  try { events = new EventSource("/api/events"); } catch (e) { return; }
  events.onopen = () => { $("link").dataset.state = "live"; $("link").textContent = "live"; };
  events.onmessage = () => { if (!document.hidden) load(false); };
  // Reconnecting is the normal state after a laptop sleeps; say it plainly rather than
  // showing "live" over a dead stream, and let EventSource retry on its own.
  events.onerror = () => { $("link").dataset.state = "down"; $("link").textContent = "reconnecting"; };
}
listen();
setInterval(() => { if (!document.hidden) load(false); }, 30000);
$("refresh").replaceChildren(ICON_REFRESH());
$("search-open").replaceChildren(ICON_SEARCH());
$("more").replaceChildren(ICON_MORE());
syncChrome();
load(true);
if (state.view === "work") loadWork().then(render);
if (state.view === "today") loadOutcomes(false).then(render);
if (state.view === "review") loadReview().then(render);
if (state.view === "reports") loadReports().then(render);
if (BOOT.y) requestAnimationFrame(() => scrollTo(0, BOOT.y));
</script>
</body>
